services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: devchester_performance
      POSTGRES_USER: performance_user
      POSTGRES_PASSWORD: performance_password_only
      TZ: UTC
    ports:
      - "127.0.0.1:15433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./seed.sql:/performance/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U performance_user -d devchester_performance"]
      interval: 2s
      timeout: 2s
      retries: 30
    cpus: 2.0
    mem_limit: 2g
    shm_size: 256m

