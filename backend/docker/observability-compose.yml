services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      TZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - observability

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB must be set}
      DB_USERNAME: ${POSTGRES_USER:?POSTGRES_USER must be set}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      SERVER_PORT: ${SERVER_PORT:-8080}
      MANAGEMENT_SERVER_PORT: ${MANAGEMENT_SERVER_PORT:-8081}
      MANAGEMENT_SERVER_ADDRESS: ${MANAGEMENT_SERVER_ADDRESS:-0.0.0.0}
      VALORIZACION_GENERAL_VALOR_BASE: ${VALORIZACION_GENERAL_VALOR_BASE:?VALORIZACION_GENERAL_VALOR_BASE must be set}
      VALORIZACION_GENERAL_FACTOR_ESCALA: ${VALORIZACION_GENERAL_FACTOR_ESCALA:?VALORIZACION_GENERAL_FACTOR_ESCALA must be set}
      VALORIZACION_POSITIONAL_VALOR_BASE: ${VALORIZACION_POSITIONAL_VALOR_BASE:?VALORIZACION_POSITIONAL_VALOR_BASE must be set}
      VALORIZACION_POSITIONAL_FACTOR_ESCALA: ${VALORIZACION_POSITIONAL_FACTOR_ESCALA:?VALORIZACION_POSITIONAL_FACTOR_ESCALA must be set}
      VALORIZACION_ELEGIBILIDAD_CONFIGURADA: ${VALORIZACION_ELEGIBILIDAD_CONFIGURADA:?VALORIZACION_ELEGIBILIDAD_CONFIGURADA must be set}
      VALORIZACION_ELEGIBILIDAD_MINIMO_PARTIDOS: ${VALORIZACION_ELEGIBILIDAD_MINIMO_PARTIDOS:-0}
      VALORIZACION_ELEGIBILIDAD_MINIMO_MINUTOS: ${VALORIZACION_ELEGIBILIDAD_MINIMO_MINUTOS:-0}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - observability

  business-gateway:
    image: nginx:1.30.7-alpine3.24
    depends_on:
      - backend
    ports:
      - "${BUSINESS_PUBLISHED_PORT:-18080}:8080"
    volumes:
      - ./business-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - observability
      - business-ingress

  collector-probe:
    image: curlimages/curl:8.11.1
    command: ["sh", "-c", "sleep infinity"]
    depends_on:
      - backend
    networks:
      - observability

  unauthorized-probe:
    image: curlimages/curl:8.11.1
    command: ["sh", "-c", "sleep infinity"]
    networks:
      - unauthorized

networks:
  observability:
    internal: true
  unauthorized:
    internal: true
  business-ingress:
    internal: false
