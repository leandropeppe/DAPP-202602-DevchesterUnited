spring.application.name=DevchesterUnitedV2
spring.profiles.active=test

# PostgreSQL real y descartable, iniciado por el driver JDBC de Testcontainers.
spring.datasource.url=jdbc:tc:postgresql:16:///devchester_test
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Las suites comparten un contenedor PostgreSQL y gestionan sus propios
# fixtures. El arranque real se valida explícitamente en
# MarketInitializationApplicationReadyIntegrationTest.
token-market.initialization.auto-start=false

# Secreto FICTICIO exclusivo de tests: Base64 de 48 bytes, apto para HS256.
# Nunca utilizar en produccion. No requiere variables de entorno.
jwt.secret=RklDVElDSU8tU09MTy1URVNULU5PLVBST0RVQ0NJT04tREVWY2hlc3Rlci0yMDI2
valorizacion.elegibilidad.configurada=true
valorizacion.general.valor-base=1.00
valorizacion.general.factor-escala=99.00
valorizacion.positional.valor-base=1.00
valorizacion.positional.factor-escala=99.00
