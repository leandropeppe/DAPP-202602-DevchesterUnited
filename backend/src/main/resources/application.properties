spring.application.name=DevchesterUnitedV2

# PostgreSQL: proporcionar la URL JDBC y las credenciales mediante el entorno.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway administra el esquema; Hibernate solo comprueba su compatibilidad.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate

# Credencial externa opcional; la ausencia deshabilita sincronizacion, no el arranque.
football-data.api-key=${FOOTBALL_DATA_API_KEY:}

# Configuración de infraestructura para la futura sincronización estadística.
# La implementación de US1 consumirá estas propiedades mediante el Adapter.
whoscored.base-url=${WHOSCORED_BASE_URL:}

# Parametros internos del endpoint statisticsfeed; solo los consume el Adapter.
whoscored.statistics.endpoint=${WHOSCORED_STATISTICS_ENDPOINT:/statisticsfeed/1/getplayerstatistics}
whoscored.statistics.stats-accumulation-type=${WHOSCORED_STATS_ACCUMULATION_TYPE:0}
whoscored.statistics.current=${WHOSCORED_STATISTICS_CURRENT:true}
whoscored.statistics.sort-by=${WHOSCORED_STATISTICS_SORT_BY:Rating}
whoscored.statistics.field=${WHOSCORED_STATISTICS_FIELD:Overall}
whoscored.statistics.min-app=${WHOSCORED_STATISTICS_MIN_APP:false}
whoscored.statistics.number-of-players-to-pick=${WHOSCORED_NUMBER_OF_PLAYERS_TO_PICK:500}
whoscored.statistics.competitions.premier-league.tournament-options=2
whoscored.statistics.competitions.premier-league.stage-id=25544
whoscored.statistics.competitions.la-liga.tournament-options=4
whoscored.statistics.competitions.la-liga.stage-id=25662
whoscored.statistics.competitions.serie-a.tournament-options=5
whoscored.statistics.competitions.serie-a.stage-id=25518
whoscored.statistics.competitions.bundesliga.tournament-options=3
whoscored.statistics.competitions.bundesliga.stage-id=25666
whoscored.statistics.competitions.ligue-1.tournament-options=22
whoscored.statistics.competitions.ligue-1.stage-id=25554

# Política de nombres de usuario: strict (actual) o flexible (caracteres no blancos).
app.auth.username-policy=${USERNAME_POLICY:strict}
app.auth.username-min-length=${USERNAME_MIN_LENGTH:3}
app.auth.username-max-length=${USERNAME_MAX_LENGTH:30}

# Documentacion deshabilitada por defecto, incluidos perfiles de produccion.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

#---
spring.config.activate.on-profile=local | test

# Mantiene acotadas las conexiones cuando varias suites Testcontainers comparten PostgreSQL.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:2}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}

# Documentacion disponible en los perfiles local y test.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
