spring.application.name=DevchesterUnitedV2

# PostgreSQL: proporcionar la URL JDBC y las credenciales mediante el entorno.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway administra el esquema; Hibernate solo comprueba su compatibilidad.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate

# Credencial externa opcional; la ausencia deshabilita sincronizacion, no el arranque.
football-data.api-key=${FOOTBALL_DATA_API_KEY:}

# Política de nombres de usuario: strict (actual) o flexible (caracteres no blancos).
app.auth.username-policy=${USERNAME_POLICY:strict}
app.auth.username-min-length=${USERNAME_MIN_LENGTH:3}
app.auth.username-max-length=${USERNAME_MAX_LENGTH:30}

# Documentacion deshabilitada por defecto, incluidos perfiles de produccion.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

#---
spring.config.activate.on-profile=local | test

# Documentacion disponible en los perfiles local y test.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
