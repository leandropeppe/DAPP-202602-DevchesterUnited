name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      FOOTBALL_DATA_API_KEY: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            backend/gradle/wrapper/gradle-wrapper.properties
            backend/build.gradle

      - name: Build and test backend
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --console=plain

      - name: Upload backend bootJar
        uses: actions/upload-artifact@v7
        with:
          name: backend-bootjar
          path: backend/build/libs/DevchesterUnitedV2-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 1

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify frontend structure
        working-directory: frontend
        run: npm run verify:frontend

      - name: Run Vitest
        working-directory: frontend
        run: npm test -- --run

      - name: Build Vite bundle
        working-directory: frontend
        run: npm run build

      - name: Upload frontend bundle
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: Playwright E2E
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    env:
      FOOTBALL_DATA_API_KEY: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Download backend bootJar
        uses: actions/download-artifact@v8
        with:
          name: backend-bootjar
          path: backend/build/libs

      - name: Download frontend bundle
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        working-directory: frontend
        run: npm run test:e2e
