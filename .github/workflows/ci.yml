name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      FOOTBALL_DATA_API_KEY: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            backend/gradle/wrapper/gradle-wrapper.properties
            backend/build.gradle

      - name: Build and test backend
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --console=plain

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify frontend structure
        working-directory: frontend
        run: npm run verify:frontend

      - name: Run Vitest
        working-directory: frontend
        run: npm run test:coverage

      - name: Build Vite bundle
        working-directory: frontend
        run: npm run build

  sonar:
    name: SonarCloud
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            backend/gradle/wrapper/gradle-wrapper.properties
            backend/build.gradle

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate backend JaCoCo XML
        run: |
          chmod +x backend/gradlew
          backend/gradlew -p backend clean test jacocoTestReport --no-daemon --console=plain
          test -f backend/build/reports/jacoco/test/jacocoTestReport.xml || {
            echo 'Backend JaCoCo XML was not generated at backend/build/reports/jacoco/test/jacocoTestReport.xml' >&2
            exit 1
          }

      - name: Generate frontend LCOV
        working-directory: frontend
        run: |
          npm ci
          npm run test:coverage
          test -f coverage/lcov.info || {
            echo 'Frontend LCOV was not generated at frontend/coverage/lcov.info' >&2
            exit 1
          }

      - name: Run SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          backend/gradlew -p backend sonar
          --no-daemon
          --console=plain
          -Dsonar.projectBaseDir="${{ github.workspace }}"
          -Dsonar.sources=backend/src/main/java,frontend/src
          -Dsonar.tests=backend/src/test/java,frontend/tests
          -Dsonar.coverage.jacoco.xmlReportPaths=backend/build/reports/jacoco/test/jacocoTestReport.xml
          -Dsonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

      - name: Verify SonarCloud Quality Gate and issue limits
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: pwsh
        run: ./scripts/verify-sonar-gate.ps1 -ProjectKey 'leandropeppe_DAPP-202602-DevchesterUnited'

  e2e:
    name: Playwright E2E
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    env:
      FOOTBALL_DATA_API_KEY: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build backend bootJar
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew bootJar --no-daemon --console=plain
          test -f build/libs/DevchesterUnitedV2-0.0.1-SNAPSHOT.jar || {
            echo 'Backend bootJar was not generated at backend/build/libs/DevchesterUnitedV2-0.0.1-SNAPSHOT.jar' >&2
            exit 1
          }

      - name: Install frontend dependencies and build bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build
          test -d dist || {
            echo 'Frontend bundle was not generated at frontend/dist' >&2
            exit 1
          }

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        working-directory: frontend
        run: npm run test:e2e
